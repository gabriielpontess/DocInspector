name: Export generation smoke test

on:
  push:
    branches: [feature/export-verification-documents-ux]
    paths: ['.github/workflows/export-smoke-fix.yml']

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/export-verification-documents-ux
          fetch-depth: 0

      - name: Align export metrics with deduplicated rows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/xlsx.js')
          text = path.read_text(encoding='utf-8')
          old = """function selectedMetrics(inspection, options = {}) {
            const selected = (inspection.documents || []).filter(document => shouldExportDocument(document, options));
            return metrics(selected);
          }"""
          new = """function selectedMetrics(inspection, options = {}) {
            const selected = uniqueBy((inspection.documents || []), document => document.id || document.code)
              .filter(document => shouldExportDocument(document, options));
            return metrics(selected);
          }"""
          if old not in text:
              raise SystemExit('selectedMetrics block not found')
          text = text.replace(old, new, 1)
          old2 = "const selectedDocuments = (inspection.documents || []).filter(document => shouldExportDocument(document, opts));"
          new2 = "const selectedDocuments = uniqueBy((inspection.documents || []), document => document.id || document.code).filter(document => shouldExportDocument(document, opts));"
          if old2 not in text:
              raise SystemExit('selectedDocuments block not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run deterministic quality gate
        run: npm run check

      - name: Generate PDF XLSX and Word in a real browser
        shell: bash
        run: |
          cat > tests/.tmp-export-smoke.html <<'HTML'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Export smoke</title></head>
          <body data-status="RUNNING"><pre id="result">RUNNING</pre>
          <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/jspdf@4.0.0/dist/jspdf.umd.min.js"></script>
          <script type="module">
          import { addFieldCopy, hydrateDocument, markNotFound, RESULT } from '../js/domain.js';
          import { buildInspectionExportData, exportInspection } from '../js/xlsx.js';
          import { exportInspectionPdf } from '../js/report.js';
          import { exportInspectionWord } from '../js/word.js';

          const result = document.querySelector('#result');
          const captured = [];
          URL.createObjectURL = blob => { captured.push(blob); return `blob:smoke-${captured.length}`; };
          URL.revokeObjectURL = () => {};
          HTMLAnchorElement.prototype.click = function() {};

          try {
            const nc = hydrateDocument({ id:'nc', code:'PW-NC', description:'Descrição longa '.repeat(250), status:'Emitido', expectedRevision:'A', result:RESULT.PENDING, fieldCopies:[] });
            addFieldCopy(nc, { id:'copy-nc', foundRevision:'B', comment:'Comentário longo '.repeat(350), markings:['Amarelo'], source:'manual' });
            const nf = hydrateDocument({ id:'nf', code:'PW-NF', description:'Documento não encontrado', status:'Emitido', expectedRevision:'A', result:RESULT.PENDING, fieldCopies:[] });
            markNotFound(nf, 'Não localizado no campo');
            const pending = hydrateDocument({ id:'pending', code:'PW-P', description:'Pendente', status:'Emitido', expectedRevision:'A', result:RESULT.PENDING, fieldCopies:[] });
            const duplicateNc = structuredClone(nc);
            const inspection = { id:'i1', name:'Teste exportação', project:'Linha 17', system:'TESTE', responsible:'Responsável', location:'Campo', documents:[nc,nf,pending,duplicateNc] };
            const options = { includeConforming:false, includeNonconforming:true, includeNotFound:true, includePending:false, includeSummary:true, includeDocuments:true, includeCopies:true, includeComments:true, includeMarkings:true, includeEvidence:true };
            const data = buildInspectionExportData(inspection, options);
            if (data.documents.length !== 2) throw new Error(`Esperava 2 documentos únicos; recebeu ${data.documents.length}`);
            if (data.metrics.total !== 2 || data.metrics.verified !== 2 || data.metrics.pending !== 0) throw new Error(`Métricas inconsistentes: ${JSON.stringify(data.metrics)}`);
            if (data.documents.map(row => row['Código PW']).join(',') !== 'PW-NC,PW-NF') throw new Error('Filtro Não conforme + Não encontrado divergente');

            exportInspectionPdf(inspection, data);
            await exportInspection(inspection, options);
            exportInspectionWord(inspection, data);

            const pdf = captured.find(blob => blob.type === 'application/pdf');
            const xlsx = captured.find(blob => blob.type === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
            const word = captured.find(blob => blob.type.startsWith('application/msword'));
            if (!pdf || !xlsx || !word) throw new Error('Um ou mais formatos não foram efetivamente gerados');

            const pdfText = new TextDecoder('latin1').decode(await pdf.arrayBuffer());
            const pages = (pdfText.match(/\/Type\s*\/Page\b/g) || []).length;
            if (pages !== 2) throw new Error(`PDF de cenário controlado deveria ter 2 páginas, recebeu ${pages}; possível página órfã`);

            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(await xlsx.arrayBuffer());
            const docsSheet = workbook.getWorksheet('Documentos');
            const copiesSheet = workbook.getWorksheet('Cópias de campo');
            if (!docsSheet || !copiesSheet) throw new Error('Abas XLSX esperadas ausentes');
            if (docsSheet.rowCount !== 8) throw new Error(`XLSX Documentos deveria ter cabeçalho + 2 linhas (rowCount 8); recebeu ${docsSheet.rowCount}`);
            if (copiesSheet.rowCount !== 7) throw new Error(`XLSX Cópias deveria conter 1 cópia (rowCount 7); recebeu ${copiesSheet.rowCount}`);

            const wordText = await word.text();
            if (!wordText.includes('PW-NC') || !wordText.includes('PW-NF') || wordText.includes('PW-P')) throw new Error('Word não respeitou o mesmo conjunto selecionado');
            if ((wordText.match(/PW-NC/g) || []).length !== 2) throw new Error('Word contém repetição inesperada de PW-NC além de documento + cópia');

            document.body.dataset.status = 'PASS';
            result.textContent = `PASS PDF=${pages} páginas; XLSX=2 documentos/1 cópia; Word=mesmo filtro`;
          } catch (error) {
            document.body.dataset.status = 'FAIL';
            result.textContent = `FAIL ${error.stack || error.message || error}`;
          }
          </script></body></html>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/docinspector-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -f tests/.tmp-export-smoke.html' EXIT
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8765/tests/.tmp-export-smoke.html > /tmp/export-smoke-dom.html
          cat /tmp/export-smoke-dom.html
          grep -q 'data-status="PASS"' /tmp/export-smoke-dom.html

      - name: Commit audited correction
        shell: bash
        run: |
          rm -f .github/workflows/export-smoke-fix.yml tests/.tmp-export-smoke.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep export summary consistent with unique rows'
          git push origin HEAD:feature/export-verification-documents-ux
