name: Mobile Inspection Actions E2E

on:
  push:
    branches:
      - fix/mobile-actions-final
      - feature/field-readiness-hardening
  pull_request:
    branches:
      - feature/field-readiness-hardening
      - develop
      - main

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install test dependency
        run: npm install --no-audit --no-fund
      - name: Static quality gates
        run: npm run check
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Browser interaction gate
        run: npm run test:e2e
      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-mobile-actions
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
