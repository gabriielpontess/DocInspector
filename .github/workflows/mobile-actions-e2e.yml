name: Mobile Inspection Actions E2E

on:
  push:
    branches:
      - fix/mobile-actions-final
      - feature/field-readiness-hardening
  pull_request:
    branches:
      - feature/field-readiness-hardening
      - develop
      - main
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'sw.js'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'tests/**'
      - 'e2e/**'
      - 'playwright.config.*'
      - 'package.json'
      - '.github/workflows/mobile-actions-e2e.yml'

concurrency:
  group: docinspector-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Browser interaction gate
        run: npm run test:e2e
      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-mobile-actions
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
