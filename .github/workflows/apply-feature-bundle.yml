          '''
          if '/* Document workflow refinement */' not in text:
              text += additions
          write(path, text)

          # ---------------- regression tests ----------------
          path = 'tests/domain.test.mjs'
          text = read(path)
          text = replace_once(text, "  removeFieldCopy,\n  RESULT,", "  removeFieldCopy,\n  updateFieldCopy,\n  RESULT,", 'domain test import')
          text = replace_once(text, "assert.deepEqual(m, { total: 2, verified: 0, conforming: 0, nonconforming: 0, notFound: 1, pending: 1 });", "assert.deepEqual(m, { total: 2, verified: 1, conforming: 0, nonconforming: 0, notFound: 1, pending: 1 });", 'verified metric expectation')
          insert_test = """
          const editable = hydrateDocument({ code:'EDIT', expectedRevision:'A', fieldCopies:[] });
          const editableCopy = addFieldCopy(editable, { foundRevision:'B', comment:'antes' });
          assert.equal(editable.result, RESULT.NONCONFORMING);
