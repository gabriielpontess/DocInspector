name: Execute feature patch safely

on:
  push:
    branches: [feature/export-verification-documents-ux]
    paths: ['.github/workflows/extract-and-apply-feature.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/export-verification-documents-ux
          fetch-depth: 0
      - name: Extract implementation script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-feature-bundle.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply_feature.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 -m py_compile /tmp/apply_feature.py
      - name: Apply feature implementation
        run: python3 /tmp/apply_feature.py
      - name: Run quality gate
        run: npm run check
      - name: Commit feature bundle
        shell: bash
        run: |
          rm -f .github/workflows/apply-feature-bundle.yml .github/workflows/extract-and-apply-feature.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: refine exports verification and document catalog'
          git push origin HEAD:feature/export-verification-documents-ux
