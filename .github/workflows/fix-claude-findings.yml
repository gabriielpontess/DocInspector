name: Apply Claude review fixes

on:
  push:
    branches: [feature/export-verification-documents-ux]
    paths:
      - '.github/workflows/fix-claude-findings.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/export-verification-documents-ux
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('js/app.js')
          text = app.read_text(encoding='utf-8')
          text, count = re.subn(
              r"\n\s*const dashboardRoot = document\.querySelector\('#global-dashboard'\);\n\s*if \(dashboardRoot\) dashboardRoot\.innerHTML = dashboard\(allDocuments\(\), 'Resumo de todas as inspeções'\);",
              '', text, count=1
          )
          if count != 1:
              raise SystemExit(f'dead dashboard refresh replacements={count}')

          text, count = re.subn(
              r"(function bindCopyQuantityControls\(\) \{\n\s*const input = document\.querySelector\('#copy-quantity'\);\n)\s*if \(!input\) return;",
              r"\1  if (!input || input.dataset.bound) return;\n  input.dataset.bound = '1';",
              text, count=1
          )
          if count != 1:
              raise SystemExit(f'copy quantity binder replacements={count}')
          app.write_text(text, encoding='utf-8')

          css = Path('styles.css')
          css_text = css.read_text(encoding='utf-8')
          css_text, count = re.subn(r"^\.global-dashboard \{ margin-bottom: 0; \}\n", '', css_text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit(f'dead global dashboard css replacements={count}')
          css.write_text(css_text, encoding='utf-8')
          PY

      - name: Run quality gate
        run: npm run check

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-claude-findings.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: address Claude review findings'
          git push origin HEAD:feature/export-verification-documents-ux
