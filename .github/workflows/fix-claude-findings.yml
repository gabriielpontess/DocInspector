name: Apply Claude review fixes

on:
  push:
    branches: [feature/export-verification-documents-ux]
    paths:
      - '.github/workflows/fix-claude-findings.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/export-verification-documents-ux
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          text = app.read_text(encoding='utf-8')
          old = """    if (state.view === 'inspect') {
              const dashboardRoot = document.querySelector('#global-dashboard');
              if (dashboardRoot) dashboardRoot.innerHTML = dashboard(allDocuments(), 'Resumo de todas as inspeções');
              updateSearchSuggestions();"""
          new = """    if (state.view === 'inspect') {
              updateSearchSuggestions();"""
          if old not in text:
              raise SystemExit('dead dashboard refresh block not found')
          text = text.replace(old, new, 1)

          old = """function bindCopyQuantityControls() {
            const input = document.querySelector('#copy-quantity');
            if (!input) return;
            const normalize = () => {"""
          new = """function bindCopyQuantityControls() {
            const input = document.querySelector('#copy-quantity');
            if (!input || input.dataset.bound) return;
            input.dataset.bound = '1';
            const normalize = () => {"""
          if old not in text:
              raise SystemExit('copy quantity binder block not found')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          css = Path('styles.css')
          css_text = css.read_text(encoding='utf-8')
          dead = ".global-dashboard { margin-bottom: 0; }\n"
          if dead not in css_text:
              raise SystemExit('dead global dashboard css not found')
          css.write_text(css_text.replace(dead, '', 1), encoding='utf-8')
          PY

      - name: Run quality gate
        run: npm run check

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-claude-findings.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: address Claude review findings'
          git push origin HEAD:feature/export-verification-documents-ux
