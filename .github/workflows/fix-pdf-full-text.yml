name: Apply full-text PDF pagination fix

on:
  push:
    branches:
      - feature/export-verification-documents-ux
    paths:
      - .github/workflows/fix-pdf-full-text.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/export-verification-documents-ux
          fetch-depth: 0
      - name: Apply PDF pagination fix
        run: python3 .github/scripts/fix_pdf_full_text.py
      - name: Run quality gate
        run: npm run check
      - name: Commit validated fix
        run: |
          rm -f .github/workflows/fix-pdf-full-text.yml .github/scripts/fix_pdf_full_text.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve full text across PDF pages'
          git push origin HEAD:feature/export-verification-documents-ux
