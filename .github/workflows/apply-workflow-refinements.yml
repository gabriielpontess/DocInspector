name: Apply workflow refinements

on:
  push:
    branches:
      - feature/az-verification-recovery-stability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/az-verification-recovery-stability
          fetch-depth: 0
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic patch
        run: node scripts/apply-az-verification-recovery-stability.mjs
      - name: Run deterministic quality checks
        run: npm run check
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/ui-refinement.js js/recovery-ui.js js/ui.js sw.js tests e2e/report-verification-navigation.spec.mjs supabase/migrations/20260903101500_retire_confidential_pdf_e2ee.sql
          git commit -m "feat: stabilize alphabetical field workflow"
          git push origin HEAD:feature/az-verification-recovery-stability
