<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#071a31">
  <meta name="color-scheme" content="light">
  <meta name="description" content="DocInspector — inspeções técnicas e controle documental em campo.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DocInspector">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="visual-system.css">
  <link rel="stylesheet" href="visual-verify.css">
  <link rel="stylesheet" href="visual-documents.css">
  <link rel="stylesheet" href="visual-overlays.css">
  <link rel="stylesheet" href="visual-responsive.css">
  <link rel="stylesheet" href="visual-refinement.css">
  <style id="modal-polish">
    .modal .export-field-evidence-option label {
      align-items: center;
      gap: 10px;
    }
    .modal .export-field-evidence-option #exp-pdf-copies {
      flex: 0 0 18px;
      width: 18px !important;
      min-width: 18px !important;
      height: 18px !important;
      min-height: 18px !important;
      margin: 0 !important;
      padding: 0 !important;
      accent-color: var(--color-navy-800);
    }
    .modal .export-field-evidence-option strong {
      margin: 0;
      font-size: var(--text-sm);
      line-height: 1.35;
    }
    .modal:has(#sync-inline-status) {
      overflow-x: hidden;
      scrollbar-gutter: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(105, 120, 139, .72) transparent;
    }
    .modal:has(#sync-inline-status)::-webkit-scrollbar { width: 8px; }
    .modal:has(#sync-inline-status)::-webkit-scrollbar-track {
      margin-block: 14px;
      background: transparent;
    }
    .modal:has(#sync-inline-status)::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 999px;
      background: rgba(105, 120, 139, .72);
      background-clip: content-box;
    }
    .modal:has(#sync-inline-status)::-webkit-scrollbar-button { display: none; }
    .modal:has(#sync-inline-status)::-webkit-scrollbar-corner { background: transparent; }

    @media (min-width: 768px) and (min-height: 720px) {
      .modal:has(#generate-pdf) {
        width: min(860px, calc(100vw - 48px));
        max-height: none;
        overflow: visible;
        padding: 18px 20px;
      }
      .modal:has(#generate-pdf) .modal-head { margin-bottom: 10px; }
      .modal:has(#generate-pdf) .export-report-preview {
        margin-bottom: 10px;
        padding: 12px 14px;
      }
      .modal:has(#generate-pdf) .export-result-panel {
        margin-bottom: 10px;
        padding: 14px 16px;
      }
      .modal:has(#generate-pdf) .export-result-heading p { margin: 4px 0 10px; }
      .modal:has(#generate-pdf) .export-result-options { gap: 8px; }
      .modal:has(#generate-pdf) .export-result-option {
        min-height: 50px;
        padding: 9px 11px;
      }
      .modal:has(#generate-pdf) .export-selection-note {
        margin: 10px 0 0;
        padding-top: 10px;
      }
      .modal:has(#generate-pdf) .export-field-evidence-option {
        margin-top: 10px;
        padding: 10px 12px;
      }
      .modal:has(#generate-pdf) .export-format-note {
        margin-top: 10px;
        padding: 10px 12px;
      }
      .modal:has(#generate-pdf) .export-actions {
        margin-top: 10px;
        padding-top: 10px;
      }
    }
  </style>
  <title>DocInspector</title>
</head>
<body>
  <noscript>O DocInspector precisa de JavaScript habilitado para funcionar.</noscript>
  <div id="app"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@4.0.0/dist/jspdf.umd.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js" crossorigin="anonymous"></script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration()
      .then(registration => registration?.update())
      .catch(() => {});
  }
</script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/field-recovery-ui.js"></script>
  <script type="module" src="js/evidence-health-ui.js"></script>
  <script type="module" src="js/marking-policy-ui.js"></script>
  <script type="module" src="js/copy-evidence-edit-ui.js"></script>
  <script type="module" src="js/ui-refinement.js"></script>
  <script type="module" src="js/export-pdf-options-ui.js"></script>
</body>
</html>
