  <style id="modal-polish">
    .modal .export-field-evidence-option label { align-items: center; gap: 10px; }
    .modal .export-field-evidence-option #exp-pdf-copies {
      flex: 0 0 18px; width: 18px !important; min-width: 18px !important; height: 18px !important; min-height: 18px !important;
      margin: 0 !important; padding: 0 !important; accent-color: var(--color-navy-800);
    }
    .modal .export-field-evidence-option strong { margin: 0; font-size: var(--text-sm); line-height: 1.35; }

    @media (min-width: 768px) {
      .modal:has(#sync-inline-status) { overflow: hidden; scrollbar-gutter: auto; }
      .modal:has(#sync-inline-status) .sync-setup-tabs {
        max-height: min(680px, calc(90dvh - 150px)); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
        padding-right: 10px; scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: rgba(105, 120, 139, .68) transparent;
      }
      .modal:has(#sync-inline-status) .sync-setup-tabs::-webkit-scrollbar { width: 7px; }
      .modal:has(#sync-inline-status) .sync-setup-tabs::-webkit-scrollbar-track { margin-block: 10px; background: transparent; }
      .modal:has(#sync-inline-status) .sync-setup-tabs::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 999px; background: rgba(105, 120, 139, .68); background-clip: content-box; }
      .modal:has(#sync-inline-status) .sync-setup-tabs::-webkit-scrollbar-button { display: none; }
      .modal:has(#sync-inline-status) .sync-setup-tabs::-webkit-scrollbar-corner { background: transparent; }
    }

    @media (min-width: 768px) and (min-height: 700px) {
      .modal:has(#generate-pdf) { width: min(980px, calc(100vw - 40px)); max-height: calc(100dvh - 28px); overflow: hidden; padding: 14px 16px; }
      .modal:has(#generate-pdf) .modal-head { margin-bottom: 8px; }
      .modal:has(#generate-pdf) .modal-head h2 { font-size: 21px; line-height: 26px; }
      .modal:has(#generate-pdf) .export-report-preview { display: grid; grid-template-columns: minmax(220px, .72fr) minmax(0, 1.28fr); align-items: center; gap: 12px; margin-bottom: 8px; padding: 10px 12px; }
      .modal:has(#generate-pdf) .export-report-preview > div:first-child { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 2px 10px; }
      .modal:has(#generate-pdf) .export-report-preview > div:first-child .section-kicker { grid-column: 1 / -1; margin-bottom: 0; }
      .modal:has(#generate-pdf) .export-report-preview > div:first-child strong { font-size: 18px; line-height: 24px; }
      .modal:has(#generate-pdf) .export-report-preview > div:first-child small { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .modal:has(#generate-pdf) .export-preview-stats { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
      .modal:has(#generate-pdf) .export-preview-stats span { min-height: 30px; padding: 5px 10px; }
      .modal:has(#generate-pdf) .export-result-panel { margin-bottom: 8px; padding: 11px 12px; }
      .modal:has(#generate-pdf) .export-result-heading { margin-bottom: 8px; }
      .modal:has(#generate-pdf) .export-result-heading h3 { margin: 1px 0 0; font-size: 17px; line-height: 22px; }
      .modal:has(#generate-pdf) .export-result-heading p { margin: 2px 0 0; font-size: 13px; line-height: 18px; }
      .modal:has(#generate-pdf) .export-result-options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
      .modal:has(#generate-pdf) .export-result-option { min-height: 48px; padding: 8px 10px; }
      .modal:has(#generate-pdf) .export-result-option strong { font-size: 13px; line-height: 17px; }
      .modal:has(#generate-pdf) .export-result-option small { font-size: 11px; line-height: 15px; }
      .modal:has(#generate-pdf) .export-selection-note { margin: 8px 0 0; padding-top: 8px; font-size: 12px; line-height: 17px; }
      .modal:has(#generate-pdf) .export-field-evidence-option { margin-top: 8px; padding: 8px 10px; }
      .modal:has(#generate-pdf) .export-format-note { margin-top: 8px; padding: 8px 10px; font-size: 12px; line-height: 18px; }
      .modal:has(#generate-pdf) .export-actions { margin-top: 8px; padding-top: 8px; }
      .modal:has(#generate-pdf) .export-actions .btn { min-height: 40px; padding-block: 8px; }
    }
  </style>
  <link rel="stylesheet" href="visual-hardening.css">
  <title>DocInspector</title>
</head>
<body>
  <noscript>O DocInspector precisa de JavaScript habilitado para funcionar.</noscript>
  <div id="app"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@4.0.0/dist/jspdf.umd.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js" crossorigin="anonymous"></script>
  <script type="importmap">
    { "imports": { "./js/sync.js": "./js/sync-auth.js" } }
  </script>
  <script id="pwa-update-handoff">
    if ('serviceWorker' in navigator) {
      let startupHandoff = false;
      let reloadingForUpdate = false;

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!startupHandoff || reloadingForUpdate) return;
        reloadingForUpdate = true;
        window.location.reload();
      });

      navigator.serviceWorker.getRegistration()
        .then(registration => {
          if (!registration) return;
          if (registration.waiting && navigator.serviceWorker.controller) {
            startupHandoff = true;
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            return;
          }
          registration?.update().catch(() => {});
        })
        .catch(() => {});
    }
  </script>
  <script type="module" src="js/settings-refinement-ui.js"></script>
  <script type="module" src="js/auth-entry.js"></script>
  <script type="module" src="js/recovery-ui.js"></script>
  <script type="module" src="js/engineering-tracker-ui.js"></script>
</body>
</html>
